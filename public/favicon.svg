<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Paper plane, nose up; rotated 45° so it flies toward the top-right.
       Matches the site's paper palette (brown ink / cream) and the paper-plane
       cursor motif. Fill swaps for dark browser tabs. -->
  <g transform="rotate(45 64 64)">
    <path class="pl" d="M64 22 L98 92 L73 95 L64 104 L55 95 L30 92 Z" />
    <path class="fold" d="M64 22 L64 104" fill="none" stroke-width="5"
      stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <style>
    .pl { fill: #4A3527; }
    .fold { stroke: #F3F2E9; }
    @media (prefers-color-scheme: dark) {
      .pl { fill: #F3F2E9; }
      .fold { stroke: #4A3527; }
    }
  </style>
</svg>
